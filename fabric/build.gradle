plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom'
}

ext.loader = 'fabric'
ext.era = 'modern'
apply from: "$rootDir/gradle/common.gradle"

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${vp.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${vp.fabric_loader_version}"
}

// 26.x は難読化なしなので、jar がそのまま配布物
ext.releaseJar = tasks.named('jar').flatMap { it.archiveFile }
tasks.register('remapOrJar') { dependsOn tasks.named('jar') }
