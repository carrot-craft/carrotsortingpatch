name: build

# push / PR: 全ローダー × 全対応バージョンでビルドとテストを回す。
# v* タグ: GitHub 上でビルドした jar を「下書きのリリース」に添付する（公開は手動）。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 既定は読み取り専用。書き込みが要るのはリリース作成のジョブだけ。
permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Gradle ラッパーの検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  modern:
    name: 26.x (${{ matrix.mc }})
    needs: validate-wrapper
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Fabric / NeoForge / Forge をビルドしてテスト
        run: ./gradlew --no-daemon :fabric:build :neoforge:build :forge:build -Pmc=${{ matrix.mc }}

  legacy:
    name: 1.21.11
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Fabric / NeoForge / Forge をビルドしてテスト
        run: ./gradlew --no-daemon :fabric-legacy:build :neoforge-legacy:build :forge-legacy:build

  release-jars:
    name: 配布用 jar の作成
    needs: [modern, legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: タグと mod_version が一致しているか確認（v1.1.0 なら mod_version=1.1.0）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "タグ ${TAG} と gradle.properties の mod_version (${version}) が違います" >&2
            exit 1
          fi
      - name: 6 構成の jar を集めて SHA-256 を作る
        run: ./gradlew --no-daemon collectReleaseJars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jars
          path: build/release/
          if-no-files-found: error

  release:
    name: 下書きリリースの作成
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-jars
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jars
          path: release/
      - name: 下書きのリリースを作る（公開は手動で確認してから）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "SHA256SUMS.txt と照合してから使ってください。"
